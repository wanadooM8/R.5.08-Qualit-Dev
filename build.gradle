plugins {
	id 'java'
	id 'idea' // optional (to generate IntelliJ IDEA project files)
    id 'jacoco'
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation(platform('org.junit:junit-bom:5.10.0'))
	testImplementation('org.junit.jupiter:junit-jupiter')
	testImplementation('org.assertj:assertj-core:3.27.7')
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
	finalizedBy jacocoTestReport // après les tests, on génère le rapport de couverture
}

jacocoTestReport {
	dependsOn test // le rapport a besoin que les tests aient tourné
	reports {
		xml.required = true
		html.outputLocation = layout.buildDirectory.dir('reports/jacoco/test')
		// dossier et fichier de rangement par défaut, mais modifiable, comme par exemple :
		// html.outputLocation = layout.projectDirectory.dir('reports/jacoco/test')
	}
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 0.90 // couverture minimale exigée : 90 %, sinon le build échoue
			}
		}
	}
}

// "gradlew check" (et donc "gradlew build") lance aussi la vérification de couverture
check.dependsOn jacocoTestCoverageVerification
