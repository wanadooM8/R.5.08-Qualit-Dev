name: Java CI
#
on: push

jobs:
  build:
    name : Integration Continue = tests + build + generation rapports AUTO
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle (valide aussi le Gradle wrapper)
        uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run:  chmod +x ./gradlew
      - name: Build & test and compute JaCoCo reports
        run: ./gradlew build # jacocoTestReport est lancé automatiquement après test (finalizedBy)
